# Dependabot config for xct-genesis.
#
# Three dependency surfaces in this repo:
#   1. Python backend — pyproject.toml + uv.lock (uv ecosystem, in beta)
#   2. Frontend (Vite/React) — frontend/package.json + package-lock.json
#   3. OpenClaw plugin — openclaw-plugin/package.json + package-lock.json
#
# Strategy:
#   - Group minor + patch updates into a single weekly PR per ecosystem
#     so reviewers aren't drowning in one-bump PRs.
#   - Hold major updates to monthly so the team can schedule upgrades.
#   - Ignore the uv ecosystem if it complains (beta) — the Python pins
#     in pyproject.toml still get surfaced via the pip ecosystem as a
#     fallback for the few direct deps that have wheels.

version: 2

updates:
  # Python (uv)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # OpenClaw plugin (npm)
  - package-ecosystem: "npm"
    directory: "/openclaw-plugin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    groups:
      plugin-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions — pin to current versions used in the workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
